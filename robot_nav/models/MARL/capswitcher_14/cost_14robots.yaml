# CAPSwitcher cost config — 14-robot system.
#
# precise_unit: cost of ONE robot driven for ONE precise sub-step.
#   A full precise decision (all 14 robots unreached, selection_interval = 5)
#   costs precise_unit x 5 x 14 = 4309.9.  Robots already at goal are skipped
#   and not charged.
#
# coarse: one entry per move-group, id = coarse action id (0-based list
#   position — same order as MOVE_GROUPS / the search / the logged shards).
#   `members` lists the robots that translate when the group is chosen —
#   informational for editing, and validated against the live group algebra
#   at load time.  `cost: auto` means len(members) x move_distance.
precise_unit: 11.57
coarse:
  # ---- size 3 -------------------------------------------------------------
  - {id: 0,  members: [2, 6, 10],                   move_distance: 1.0, cost: 52.7}
  - {id: 1,  members: [4, 6, 12],                   move_distance: 1.0, cost: 52.7}
