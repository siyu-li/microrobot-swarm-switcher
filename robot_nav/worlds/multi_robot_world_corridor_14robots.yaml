# 14-robot "corridor" world: sparse start band → dense obstacle gate → sparse
# goal band, so obstacle density varies along x only and a rendered episode can
# be read phase by phase (see SIM_ENV/corridor_layout.py).
#
# Geometry identical to multi_robot_world_obstacle_14robots.yaml — same arena,
# same robot count, and in particular the SAME 7 obstacles: the frozen GAT
# backbone is built with num_obstacles = len(env.obstacle_list), so changing
# that count would make the checkpoint unusable.  Only the *placement* differs.
#
# The distributions below are the initial draw; MARL_SIM_OBSTACLE.reset()
# re-draws starts, goals and obstacles inside the bands each episode when it is
# constructed with a CorridorLayout, so these values only matter for the very
# first frame.

world:
  height: 15
  width: 15
  step_time: 0.3
  sample_time: 0.3
  collision_mode: 'reactive'

robot:
  - number: 14
    kinematics: {name: 'diff'}
    # Left band; re-drawn per episode by the CorridorLayout sampler.
    distribution: {name: 'random', range_low: [1, 1, -3.14], range_high: [3.75, 14, 3.14]}
    shape: {name: 'circle', radius: 0.2}
    vel_min: [ 0, -1.0 ]
    vel_max: [ 0.5, 1.0 ]
    state: [2, 2, 0, 0]
    goal: [13, 13, 0]
    color: ['royalblue', 'red', 'green', 'orange', 'purple', 'yellow', 'cyan', 'magenta', 'lime', 'pink', 'brown', 'black', 'bisque', 'slategrey', 'lavender', 'hotpink', 'navy', 'gold', 'olive', 'peru']
    arrive_mode: position
    goal_threshold: 0.3

    plot:
      show_trajectory: false

# The gate: 7 static obstacles in the middle band, x in [6, 9].
obstacle:
  - number: 7
    shape: {name: 'circle', radius: 0.7}
    distribution: {name: 'random', range_low: [6, 1, -3.14], range_high: [9, 14, 3.14]}
    kinematics: {name: 'static'}
    color: 'saddlebrown'
